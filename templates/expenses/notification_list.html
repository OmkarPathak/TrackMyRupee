{% extends "base.html" %}
{% load static i18n digit_filters %}

{% block title %}Notifications - TrackMyRupee{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        {% include 'expenses/partials/_notification_list.html' %}
    </div>
</div>

<style>
@media (max-width: 767.98px) {
    .notification-list-card {
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
    }
    #mobileGridView {
        padding-left: 0 !important;
        padding-right: 0 !important;
    }

    #mobileGridView .expense-card .card-body > .mobile-card-inner {
        display: grid !important;
        /* Precise widths for card components: icon: 38px info: 1fr right: 80px */
        grid-template-columns: 38px minmax(0, 1fr) 80px !important;
        grid-template-areas: "icon info time" !important;
        align-items: center !important;
        gap: 0 !important;
        transition: all 0.3s ease;
    }

    #mobileGridView .expense-card .category-icon-container { 
        grid-area: icon; 
        margin: 0 !important; 
        width: 32px !important;
        height: 32px !important;
        justify-self: center;
    }
    #mobileGridView .expense-card .flex-grow-1 { 
        grid-area: info; 
        margin: 0 !important; 
        padding-left: 0.5rem !important;
        padding-right: 0.5rem !important;
        overflow: hidden;
    }
    #mobileGridView .expense-card .flex-shrink-0.text-end { 
        grid-area: time; 
        margin: 0 !important; 
        width: 100% !important;
        padding-right: 4px;
    }
}

/* Card View Styles */
.expense-card {
    border-radius: 16px !important;
    border: 1px solid var(--bs-border-color-translucent) !important;
    background-color: var(--bs-body-bg);
}

[data-bs-theme="dark"] .expense-card {
    border-color: rgba(255,255,255,0.1) !important;
}

/* Category Icon Alignment */
.category-icon-container {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    flex-shrink: 0;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 12px;
    background-color: var(--bs-tertiary-bg);
}

.line-clamp-1 {
    display: -webkit-box;
    -webkit-line-clamp: 1;
    line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
    white-space: normal;
}
.line-clamp-2 {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    white-space: normal;
    line-height: 1.25;
    max-height: 2.5em;
}

@media (max-width: 576px) {
    .category-icon-container {
        width: 32px;
        height: 32px;
        font-size: 1rem;
    }
}

.empty-state-container svg {
    max-width: 160px;
    max-height: 140px;
    height: auto;
}
.pointer-events-none {
    pointer-events: none;
}
</style>
{% endblock %}

{% extends 'base.html' %}
{% load i18n digit_filters expense_extras humanize %}

{% block title %}{% trans "Capital Events" %}{% endblock %}

{% block content %}
<style>
    /* Remove bottom border from last row to keep the card bottom clean */
    .table tbody tr:last-child td {
        border-bottom: 0 !important;
    }
    .table {
        border-bottom: 0 !important;
    }
    /* Soften table row borders for premium look */
    .table th, .table td {
        border-bottom: 1px solid rgba(0, 0, 0, 0.08) !important;
    }
    [data-bs-theme="dark"] .table th, [data-bs-theme="dark"] .table td {
        border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
    }

    /* Card View Styles */
    .expense-card {
        border-radius: 16px !important;
        border: 1px solid var(--bs-border-color-translucent) !important;
        background-color: var(--bs-body-bg);
    }
    .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        white-space: normal;
        line-height: 1.25;
        max-height: 2.5em;
    }
    .view-toggle-btn, .filter-toggle-btn, .header-action-btn {
        height: 36px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px !important;
        transition: all 0.2s ease;
        border: 1px solid var(--bs-border-color);
        background: transparent;
        color: var(--bs-secondary);
    }
    .view-toggle-btn, .filter-toggle-btn {
        width: 36px;
    }
    .header-action-btn {
        padding: 0 0.75rem;
        font-size: 0.875rem;
        text-decoration: none;
        color: var(--bs-body-color);
    }
    .header-action-btn.btn-primary {
        background-color: var(--bs-primary) !important;
        color: white !important;
        border: none !important;
    }
    .view-toggle-btn.active, .filter-toggle-btn[aria-expanded="true"] {
        background: rgba(var(--bs-primary-rgb), 0.1) !important;
        color: var(--bs-primary) !important;
        border-color: rgba(var(--bs-primary-rgb), 0.3) !important;
        box-shadow: none !important;
    }
    .filter-toggle-btn:hover {
        opacity: 0.9;
    }
    .filter-toggle-btn[aria-expanded="true"]:hover {
        opacity: 0.8;
    }
    [data-bs-theme="dark"] .view-toggle-btn.active,
    [data-bs-theme="dark"] .filter-toggle-btn[aria-expanded="true"] {
        background: rgba(255, 255, 255, 0.1) !important;
        color: #fff !important;
        border-color: rgba(255, 255, 255, 0.2) !important;
    }

    /* Filter Bar Standardization */
    #filter-form .form-control,
    #filter-form .form-select,
    #filter-form .input-group-text,
    #filter-form .btn {
        height: 36px !important;
        font-size: 0.875rem !important;
        display: flex;
        align-items: center;
    }

    #filter-form .multiselect.dropdown-toggle {
        height: 36px !important;
        font-size: 0.875rem !important;
    }

    #filter-form .btn {
        padding: 0 0.75rem;
        white-space: nowrap;
    }

    /* Category Icon Alignment */
    .category-icon-container {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
        flex-shrink: 0;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        color: var(--bs-secondary-color);
        border-radius: 12px;
        background-color: transparent;
    }
    .expense-card:hover .category-icon-container {
        background-color: var(--bs-tertiary-bg);
        transform: scale(1.08);
        color: var(--bs-primary);
    }

    /* Clean bottom border of the last row in desktop table */
    #tableView table tbody tr:last-child td {
        border-bottom: 0 !important;
    }
    
    @media (max-width: 576px) {
        .category-icon-container {
            width: 32px;
            height: 32px;
            font-size: 1rem;
        }
    }

    @media (max-width: 767.98px) {
        #mainCardContainer {
            background: transparent !important;
            box-shadow: none !important;
            border: none !important;
        }
        #mainCardContainer > .card-body {
            padding: 0 !important;
        }
        .card-body.p-0 {
            overflow: hidden;
        }
        .table-responsive {
            overflow-x: auto !important;
            -webkit-overflow-scrolling: touch;
        }
        .table-responsive table {
            min-width: 700px;
        }
        #mobileGridView .expense-card .card-body > .mobile-card-inner {
            display: grid !important;
            grid-template-columns: 38px minmax(0, 1fr) 110px 30px !important;
            grid-template-areas: "icon info amount menu" !important;
            align-items: center !important;
            gap: 0 !important;
        }
        #mobileGridView .expense-card .category-icon-container { 
            grid-area: icon; 
            margin: 0 !important; 
            width: 32px !important;
            height: 32px !important;
            justify-self: center;
        }
        #mobileGridView .expense-card .flex-grow-1 { 
            grid-area: info; 
            margin: 0 !important; 
            padding-left: 0.5rem !important;
            padding-right: 0.5rem !important;
            overflow: hidden;
        }
        #mobileGridView .expense-card .flex-shrink-0.text-end { 
            grid-area: amount; 
            margin: 0 !important; 
            width: 100% !important;
            padding-right: 4px;
        }
        #mobileGridView .expense-card .dropdown { 
            grid-area: menu; 
            margin: 0 !important; 
            justify-self: center;
        }
    }
</style>
<div class="fade-in">
    {% include 'expenses/partials/_capital_event_list.html' %}
</div>
{% endblock %}

{% block scripts %}
<script>
    // Initialize Tooltips and View Toggles
    document.addEventListener('DOMContentLoaded', function () {
        const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl, {
                boundary: document.body 
            });
        });

        // No view toggling logic needed anymore. Views are rendered natively based on screen width via CSS.
    });
</script>
{% endblock %}

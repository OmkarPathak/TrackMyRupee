{% extends 'base.html' %}
{% load i18n digit_filters humanize %}

{% block content %}
{% include 'expenses/partials/_loan_list_partial.html' %}
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
function renderLoanListCharts() {
    if (typeof Chart === 'undefined') return;
    const isDark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
    const textColor = isDark ? '#e2e8f0' : '#475569';
    const gridColor = isDark ? 'rgba(255, 255, 255, 0.08)' : 'rgba(0, 0, 0, 0.05)';
    const currency = '{{ user.profile.currency }}';

    // Donut Values Plugin for portfolio breakdown
    const drawDonutValuesPlugin = {
        id: 'drawDonutValuesPortfolio',
        afterDatasetsDraw(chart) {
            const { ctx } = chart;
            ctx.save();
            chart.data.datasets.forEach((dataset, i) => {
                const meta = chart.getDatasetMeta(i);
                if (meta.hidden) return;
                const total = dataset.data.reduce((acc, curr) => acc + (curr || 0), 0);

                meta.data.forEach((element, index) => {
                    const value = dataset.data[index];
                    if (!value || total === 0) return;
                    const percentage = value / total;
                    if (percentage < 0.05) return;

                    const text = typeof window.compactAmount === 'function'
                        ? currency + window.compactAmount(value, currency)
                        : currency + value.toLocaleString();

                    const { x, y } = element.tooltipPosition();
                    ctx.font = 'bold 11px "DM Sans", sans-serif';
                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                    ctx.shadowBlur = 3;
                    ctx.fillText(text, x, y);
                    ctx.shadowColor = 'transparent';
                });
            });
            ctx.restore();
        }
    };

    // Bar Chart Values Plugin for loan comparison chart
    const drawBarValuesPlugin = {
        id: 'drawBarValuesComp',
        afterDatasetsDraw(chart) {
            const { ctx } = chart;
            ctx.save();
            chart.data.datasets.forEach((dataset, i) => {
                const meta = chart.getDatasetMeta(i);
                if (meta.hidden) return;

                meta.data.forEach((element, index) => {
                    const value = dataset.data[index];
                    if (value === 0 || value === null || value === undefined) return;

                    const text = typeof window.compactAmount === 'function'
                        ? currency + window.compactAmount(value, currency)
                        : currency + value.toLocaleString();

                    ctx.font = 'bold 10px "DM Sans", sans-serif';
                    ctx.fillStyle = textColor;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';

                    const x = element.x;
                    const y = element.y - 4;
                    ctx.fillText(text, x, y);
                });
            });
            ctx.restore();
        }
    };

    // 1. Doughnut Chart: Portfolio Debt Breakdown
    const portfolioCtx = document.getElementById('portfolioBreakdownChart');
    const portfolioDataEl = document.getElementById('portfolio-breakdown-data');
    if (portfolioCtx && portfolioDataEl) {
        const existingPortfolio = Chart.getChart(portfolioCtx);
        if (existingPortfolio) {
            existingPortfolio.destroy();
        }
        try {
            const data = JSON.parse(portfolioDataEl.textContent);
            const hasData = data.values && data.values.some(v => v > 0);
            if (hasData) {
                const portfolioChart = new Chart(portfolioCtx, {
                    type: 'doughnut',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            data: data.values,
                            backgroundColor: ['#1D9E75', '#F59E0B', '#EF4444'],
                            borderWidth: 2,
                            borderColor: isDark ? '#1e293b' : '#ffffff',
                            hoverOffset: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: function(ctx) {
                                        const val = ctx.parsed || 0;
                                        return ` ${ctx.label}: ${currency}${val.toLocaleString()}`;
                                    }
                                }
                            }
                        },
                        cutout: '74%',
                        onHover: function(event, activeElements) {
                            const items = document.querySelectorAll('.breakdown-item');
                            items.forEach(el => el.classList.remove('border-primary', 'shadow-sm'));
                            if (activeElements && activeElements.length > 0) {
                                const idx = activeElements[0].index;
                                const target = document.querySelector(`.breakdown-item[data-index="${idx}"]`);
                                if (target) {
                                    target.classList.add('border-primary', 'shadow-sm');
                                }
                            }
                        }
                    }
                });

                document.querySelectorAll('.breakdown-item').forEach(item => {
                    item.addEventListener('mouseenter', function() {
                        const idx = parseInt(this.getAttribute('data-index'), 10);
                        if (portfolioChart && !isNaN(idx)) {
                            portfolioChart.setActiveElements([{ datasetIndex: 0, index: idx }]);
                            portfolioChart.update();
                        }
                    });
                    item.addEventListener('mouseleave', function() {
                        if (portfolioChart) {
                            portfolioChart.setActiveElements([]);
                            portfolioChart.update();
                        }
                    });
                });
            }
        } catch (err) {
            console.error('Error rendering portfolio breakdown chart:', err);
        }
    }

    // 2. Bar Chart: Loan Principal Progress Comparison
    const compCtx = document.getElementById('loanComparisonChart');
    const compDataEl = document.getElementById('loan-comparison-data');
    if (compCtx && compDataEl) {
        const existingComp = Chart.getChart(compCtx);
        if (existingComp) {
            existingComp.destroy();
        }
        try {
            const data = JSON.parse(compDataEl.textContent);
            if (data.labels && data.labels.length > 0) {
                new Chart(compCtx, {
                    type: 'bar',
                    data: {
                        labels: data.labels,
                        datasets: [
                            {
                                label: '{% trans "Principal Paid" %}',
                                data: data.principal_paid,
                                backgroundColor: 'rgba(29, 158, 117, 0.85)',
                                borderRadius: 4
                            },
                            {
                                label: '{% trans "Remaining Principal" %}',
                                data: data.remaining_principal,
                                backgroundColor: 'rgba(239, 68, 68, 0.85)',
                                borderRadius: 4
                            }
                        ]
                    },
                    plugins: [drawBarValuesPlugin],
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: false,
                        plugins: {
                            legend: {
                                position: 'top',
                                labels: {
                                    color: textColor,
                                    font: { size: 11, weight: '500' },
                                    usePointStyle: true
                                }
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(ctx) {
                                        const val = ctx.parsed.y || 0;
                                        return ` ${ctx.dataset.label}: ${currency}${val.toLocaleString()}`;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                grid: { display: false },
                                ticks: { color: textColor, font: { size: 10 } }
                            },
                            y: {
                                grid: { color: gridColor },
                                ticks: { color: textColor, font: { size: 10 } }
                            }
                        }
                    }
                });
            }
        } catch (err) {
            console.error('Error rendering loan comparison chart:', err);
        }
    }
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', renderLoanListCharts);
} else {
    renderLoanListCharts();
}

document.body.addEventListener('htmx:afterSettle', function(e) {
    if (e.detail.target && e.detail.target.id === 'loans-shell') {
        requestAnimationFrame(renderLoanListCharts);
    }
});
</script>
{% endblock %}

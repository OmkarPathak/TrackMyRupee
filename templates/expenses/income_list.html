{% extends 'base.html' %}
{% load i18n digit_filters humanize expense_extras %}

{% block content %}
<style>
    /* Responsive Filter Widths */
    #filter-form .row,
    #filter-form .row > [class*="col"] {
        overflow: visible !important;
    }

    #filter-form .btn-group {
        position: static;
    }

    /* Button Stylings matching expense_list.html */
    .view-toggle-btn, .filter-toggle-btn, .header-action-btn {
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px !important;
        transition: all 0.2s ease;
        border: 1px solid var(--bs-border-color);
        background: transparent;
    }
    .view-toggle-btn, .filter-toggle-btn {
        width: 36px;
        padding: 0;
        color: var(--bs-secondary);
    }
    .header-action-btn {
        padding: 0 0.75rem;
        font-size: 0.875rem;
        text-decoration: none;
        color: var(--bs-body-color);
    }
    .header-action-btn.btn-primary {
        background-color: var(--bs-primary) !important;
        color: white !important;
        border: none !important;
    }
    .view-toggle-btn.active, .filter-toggle-btn[aria-expanded="true"] {
        background: rgba(var(--bs-primary-rgb), 0.1) !important;
        color: var(--bs-primary) !important;
        border-color: rgba(var(--bs-primary-rgb), 0.3) !important;
        box-shadow: none !important;
    }
    .filter-toggle-btn:hover, .header-action-btn:hover {
        opacity: 0.9;
    }

    @media (max-width: 767.98px) {
        .card-body.p-0 {
            overflow: hidden;
        }

        .table-responsive {
            overflow-x: auto !important;
            -webkit-overflow-scrolling: touch;
        }

        .table-responsive table {
            min-width: 700px;
        }

        /* Force deterministic horizontal alignment with CSS Grid Areas for mobile cards */
        #mobileGridView .expense-card .card-body > .mobile-card-inner {
            display: grid !important;
            grid-template-columns: 38px minmax(0, 1fr) 95px 30px !important;
            grid-template-areas: "icon info amount menu" !important;
            align-items: center !important;
            gap: 0 !important;
        }

        #mobileGridView .expense-card .category-icon-container { 
            grid-area: icon; 
            margin: 0 !important; 
            width: 32px !important;
            height: 32px !important;
            justify-self: center;
        }
        #mobileGridView .expense-card .flex-grow-1 { 
            grid-area: info; 
            margin: 0 !important; 
            padding-left: 0.5rem !important;
            padding-right: 0.5rem !important;
            overflow: hidden;
        }
        #mobileGridView .expense-card .flex-shrink-0.text-end { 
            grid-area: amount; 
            margin: 0 !important; 
            width: 100% !important;
            padding-right: 4px;
        }
        #mobileGridView .expense-card .dropdown { 
            grid-area: menu; 
            margin: 0 !important; 
            justify-self: center;
        }
    }

    /* Card View Styles */
    .expense-card {
        border-radius: 16px !important;
        border: 1px solid var(--bs-border-color-translucent) !important;
        background-color: var(--bs-body-bg);
    }

    .category-icon-container {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
        flex-shrink: 0;
        border-radius: 12px;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        color: var(--bs-secondary-color);
        background-color: transparent;
    }
    .expense-card:hover .category-icon-container {
        background-color: var(--bs-tertiary-bg);
        transform: scale(1.08);
        color: var(--bs-primary);
    }
    
    @media (max-width: 576px) {
        .category-icon-container {
            width: 32px;
            height: 32px;
            font-size: 1rem;
        }
    }

    /* Clean bottom border of the last row in desktop table */
    #tableView table tbody tr:last-child td {
        border-bottom: 0 !important;
    }

    #tableView table th {
        font-size: 0.95rem !important;
    }
    #tableView table td {
        font-size: 0.95rem !important;
    }

    @media (min-width: 768px) {
        .border-end-md {
            border-right: 1px solid var(--bs-border-color) !important;
        }
    }
</style>

<div class="fade-in">
    {% include 'expenses/partials/_income_list.html' %}
</div>
{% endblock %}

{% block modals %}
    <!-- Edit Income Modal -->
    <div class="modal fade" id="editIncomeModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">{% trans "Edit Income" %}</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editIncomeForm" method="post">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ request.get_full_path }}">
                        
                        <div class="row mb-3">
                            <div class="col-6">
                                <label for="edit_date" class="form-label text-muted small text-uppercase">{% trans "Date" %}</label>
                                <input type="date" class="form-control" id="edit_date" name="date" required>
                            </div>
                            <div class="col-6">
                                <label for="edit_currency" class="form-label text-muted small text-uppercase">{% trans "Currency" %}</label>
                                <select class="form-select" id="edit_currency" name="currency" required>
                                    {% for code, name in currency_choices %}
                                        <option value="{{ code }}">{{ code }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-6">
                                <label for="edit_amount" class="form-label text-muted small text-uppercase">{% trans "Amount" %}</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-transparent border-end-0 text-muted">{{ user.profile.currency }}</span>
                                    <input type="number" class="form-control border-start-0 ps-0" id="edit_amount" name="amount" step="0.01" required>
                                </div>
                            </div>
                            <div class="col-6">
                                <label for="edit_source_type" class="form-label text-muted small text-uppercase">{% trans "Source Type" %}</label>
                                <select class="form-select" id="edit_source_type" name="source_type" required>
                                    <option value="Salary">{% trans "Salary" %}</option>
                                    <option value="Freelance / Consulting">{% trans "Freelance / Consulting" %}</option>
                                    <option value="Business">{% trans "Business" %}</option>
                                    <option value="Investment Returns">{% trans "Investment Returns" %}</option>
                                    <option value="Rental Income">{% trans "Rental Income" %}</option>
                                    <option value="Cashback & Rewards">{% trans "Cashback & Rewards" %}</option>
                                    <option value="Refund / Reimbursement">{% trans "Refund / Reimbursement" %}</option>
                                    <option value="Other">{% trans "Other" %}</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="edit_description" class="form-label text-muted small text-uppercase">{% trans "Description" %}</label>
                            <textarea class="form-control" id="edit_description" name="description" rows="2"></textarea>
                        </div>
                        
                        <div class="mb-4">
                            <label for="edit_account" class="form-label text-muted small text-uppercase">{% trans "Account" %}</label>
                            <select class="form-select searchable-select" id="edit_account" name="account">
                                {% for account in accounts %}
                                    <option value="{{ account.pk }}">{{ account.name }} ({{ account.currency }}{{ account.balance|ind_comma:account.currency|translate_digits }})</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <div class="form-check form-switch mb-2">
                                <input type="checkbox" class="form-check-input" id="edit_add_to_recurring" name="add_to_recurring">
                                <label class="form-check-label fw-bold small text-muted text-uppercase" for="edit_add_to_recurring">
                                    {% trans "Make this a recurring income" %}
                                </label>
                            </div>
                            <div id="edit-frequency-container" style="display: none;">
                                <label for="edit_frequency" class="form-label small text-muted fw-bold text-uppercase">{% trans "Frequency" %}</label>
                                <select class="form-select" id="edit_frequency" name="frequency">
                                    <option value="DAILY">{% trans "Daily" %}</option>
                                    <option value="WEEKLY">{% trans "Weekly" %}</option>
                                    <option value="MONTHLY" selected>{% trans "Monthly" %}</option>
                                    <option value="QUARTERLY">{% trans "Quarterly" %}</option>
                                    <option value="YEARLY">{% trans "Yearly" %}</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary">{% trans "Save Changes" %}</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var editModal = document.getElementById('editIncomeModal');
            if (editModal) {
                editModal.addEventListener('show.bs.modal', function(event) {
                    var button = event.relatedTarget;
                    var url = button.getAttribute('data-url');
                    var date = button.getAttribute('data-date');
                    var description = button.getAttribute('data-description');
                    var sourceType = button.getAttribute('data-source-type');
                    var amount = button.getAttribute('data-amount');
                    var currency = button.getAttribute('data-currency');
                    
                    var form = editModal.querySelector('#editIncomeForm');
                    var dateInput = editModal.querySelector('#edit_date');
                    var descInput = editModal.querySelector('#edit_description');
                    var sourceTypeInput = editModal.querySelector('#edit_source_type');
                    var amountInput = editModal.querySelector('#edit_amount');
                    var currencyInput = editModal.querySelector('#edit_currency');
                    var accountInput = editModal.querySelector('#edit_account');
                    var recurringCheckbox = editModal.querySelector('#edit_add_to_recurring');
                    var frequencyContainer = editModal.querySelector('#edit-frequency-container');
                    
                    form.action = url;
                    
                    // Set recurring fields from button data
                    var isRecurring = button.getAttribute('data-is-recurring') === 'true';
                    if (recurringCheckbox) {
                        recurringCheckbox.checked = isRecurring;
                        frequencyContainer.style.display = isRecurring ? 'block' : 'none';
                    }
                    
                    // Format date to YYYY-MM-DD for input type=date
                     if (date) {
                        var dateObj = new Date(date);
                         var userTimezoneOffset = dateObj.getTimezoneOffset() * 60000;
                        var adjustedDate = new Date(dateObj.getTime() - userTimezoneOffset);
                        dateInput.value = adjustedDate.toISOString().split('T')[0];
                    } else {
                         dateInput.value = '';
                    }

                    dateInput.value = date;

                    if (descInput) {
                        descInput.value = description !== 'None' ? description : '';
                    }
                    if (sourceTypeInput) {
                        sourceTypeInput.value = sourceType || 'Salary';
                    }
                    amountInput.value = amount;
                    currencyInput.value = currency;
                    accountInput.value = button.getAttribute('data-account');
                    accountInput.dispatchEvent(new Event('change', { bubbles: true }));

                    var freq = button.getAttribute('data-frequency');
                    if (freq) {
                        editModal.querySelector('#edit_frequency').value = freq;
                    }
                });
            }

            const editRecurringCheckbox = document.getElementById('edit_add_to_recurring');
            const editFrequencyContainer = document.getElementById('edit-frequency-container');
            if (editRecurringCheckbox) {
                editRecurringCheckbox.addEventListener('change', function() {
                    editFrequencyContainer.style.display = this.checked ? 'block' : 'none';
                });
            }
        });
    </script>
{% endblock %}

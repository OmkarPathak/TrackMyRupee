{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow border-0">
            <div class="card-body p-4 text-center">
                <i class="bi bi-exclamation-triangle text-warning fs-1 mb-3"></i>
                <h3 class="h4 mb-3">Delete Expense?</h3>
                <p class="text-muted mb-4">
                    Are you sure you want to delete this expense?<br>
                    <strong>{{ object.description }}</strong> - {{ object.amount }}
                </p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'expense-list' %}?{{ request.GET.urlencode }}" class="btn btn-action-cancel">{% trans "Cancel" %}</a>
                        <button type="submit" class="btn btn-action-danger">{% trans "Delete" %}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

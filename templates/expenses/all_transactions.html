{% extends 'base.html' %}
{% load i18n digit_filters expense_extras humanize %}

{% block content %}
<style>
    .table-responsive {
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch;
    }

    #tableView table tbody tr:last-child td {
        border-bottom: 0 !important;
    }

    #tableView table th,
    #tableView table td {
        font-size: 0.95rem !important;
    }

    @media (max-width: 767.98px) {
        .table-responsive table {
            min-width: 800px;
        }

        #mobileGridView .expense-card .card-body > .mobile-card-inner {
            display: grid !important;
            grid-template-columns: 38px minmax(0, 1fr) 95px 30px !important;
            grid-template-areas: "icon info amount menu" !important;
            align-items: center !important;
            gap: 0 !important;
        }

        #mobileGridView .expense-card .category-icon-container {
            grid-area: icon;
            margin: 0 !important;
            width: 32px !important;
            height: 32px !important;
            justify-self: center;
        }

        #mobileGridView .expense-card .flex-grow-1 {
            grid-area: info;
            margin: 0 !important;
            padding-left: 0.5rem !important;
            padding-right: 0.5rem !important;
            overflow: hidden;
        }

        #mobileGridView .expense-card .flex-shrink-0.text-end {
            grid-area: amount;
            margin: 0 !important;
            width: 100% !important;
            padding-right: 4px;
        }

        #mobileGridView .expense-card .dropdown {
            grid-area: menu;
            margin: 0 !important;
            justify-self: center;
        }
    }

    .expense-card {
        border-radius: 16px !important;
        border: 1px solid var(--bs-border-color-translucent) !important;
        background-color: var(--bs-body-bg);
    }

    .view-toggle-btn,
    .filter-toggle-btn,
    .header-action-btn {
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px !important;
        transition: all 0.2s ease;
        border: 1px solid var(--bs-border-color);
        background: transparent;
    }

    .view-toggle-btn,
    .filter-toggle-btn {
        width: 36px;
        padding: 0;
        color: var(--bs-secondary);
    }

    .header-action-btn {
        padding: 0 0.75rem;
        font-size: 0.875rem;
        text-decoration: none;
        color: var(--bs-body-color);
    }

    .header-action-btn.btn-primary {
        background-color: var(--bs-primary) !important;
        color: white !important;
        border: none !important;
    }

    .view-toggle-btn.active,
    .filter-toggle-btn[aria-expanded="true"] {
        background: rgba(var(--bs-primary-rgb), 0.1) !important;
        color: var(--bs-primary) !important;
        border-color: rgba(var(--bs-primary-rgb), 0.3) !important;
        box-shadow: none !important;
    }

    .filter-toggle-btn:hover,
    .header-action-btn:hover {
        opacity: 0.9;
    }

    .amount-sort-link {
        color: inherit;
        gap: 0.35rem;
    }

    .amount-sort-link:hover {
        color: var(--bs-primary);
    }

    .category-icon-container {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
        flex-shrink: 0;
        border-radius: 12px;
        background-color: var(--bs-tertiary-bg);
    }

    .type-badge {
        font-size: 0.7rem;
        text-transform: uppercase;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 4px;
        letter-spacing: 0.02em;
    }

    .type-expense { background-color: rgba(224, 92, 69, 0.1); color: var(--color-danger); }
    .type-income { background-color: rgba(93, 202, 165, 0.15); color: var(--color-success); }
    .type-transfer { background-color: rgba(55, 138, 221, 0.1); color: #378ADD; }
    .type-loan { background-color: rgba(245, 158, 11, 0.12); color: #B45309; }
    .type-capital_event { background-color: rgba(108, 117, 125, 0.1); color: #E05C45; }

    .amount-expense { color: var(--color-danger); }
    .amount-income { color: var(--color-success) !important; }
    .amount-transfer { color: #378ADD; }
    .amount-loan { color: #B45309; }
    .amount-capital_event { color: #E05C45; }

    .empty-state-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 4rem 2rem;
        border-radius: 20px;
        margin: 2rem 0;
    }

    .empty-state-container svg {
        width: 100%;
        max-width: 160px;
        height: auto;
    }

    .max-width-300 { max-width: 300px; }

    .stats-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .stats-label {
        font-size: 0.78rem;
        color: var(--bs-body-color);
    }

    .stats-count {
        font-size: 0.72rem;
        font-weight: 400;
        color: var(--bs-secondary-color);
    }

    .stats-amount {
        font-size: 0.8rem;
        font-weight: 700;
    }

    .filter-pills-container {
        display: flex;
        gap: 0.5rem;
        overflow-x: auto;
        padding: 0.35rem 0;
        margin-top: 0.5rem;
        margin-bottom: 0.5rem;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
    }

    .filter-pills-container::-webkit-scrollbar {
        display: none;
    }

    .filter-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.25rem 1rem;
        border-radius: 50px;
        font-size: 0.8rem;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.2s ease;
        border: 1px solid transparent;
        white-space: nowrap;
    }

    .filter-pill-inactive {
        background-color: var(--bs-tertiary-bg);
        color: var(--bs-secondary-color);
        border-color: rgba(0,0,0,0.06);
    }

    .filter-pill-inactive:hover {
        background-color: var(--bs-secondary-bg);
        color: var(--bs-body-color);
    }

    .filter-pill.active {
        background-color: #1D9E75;
        border-color: #1D9E75;
        color: #fff;
    }
</style>

{% include 'expenses/partials/_transaction_list.html' %}
{% endblock %}

{% load i18n l10n %}
<div class="dropdown d-inline-block">
    <button class="btn btn-link btn-sm text-decoration-none p-0 no-caret" type="button" data-bs-toggle="dropdown" aria-expanded="false"
            aria-label="{% trans 'Purchase actions' %}" data-bs-popper-config='{"strategy":"fixed"}' data-bs-boundary="viewport">
        <i class="bi bi-three-dots-vertical text-muted" aria-hidden="true"></i>
        <span class="visually-hidden">{% trans "Purchase actions" %}</span>
    </button>
    <ul class="dropdown-menu dropdown-menu-end shadow border-0">
        <li>
            <button type="button" class="dropdown-item py-2 border-0 bg-transparent w-100 text-start"
                    data-bs-toggle="modal" data-bs-target="#purchaseModal" data-mode="edit"
                    data-url="{% url 'holding-purchase-edit' tx.pk %}" data-date="{{ tx.date|date:'Y-m-d' }}"
                    data-units="{% if tx.units is not None %}{{ tx.units|unlocalize }}{% endif %}" data-price="{% if tx.price is not None %}{{ tx.price|unlocalize }}{% endif %}"
                    data-amount="{{ tx.amount|unlocalize }}" data-note="{{ tx.note }}"
                    data-cutoff="{% if tx.before_cutoff %}before{% else %}after{% endif %}" data-kind="{{ tx.kind }}">
                <i class="bi bi-pencil-square me-2" aria-hidden="true"></i>{% trans "Edit" %}
            </button>
        </li>
        {% if tx_total > 1 %}
        <li>
            <button type="button" class="dropdown-item py-2 text-danger border-0 bg-transparent w-100 text-start"
                    data-bs-toggle="modal" data-bs-target="#deleteModal"
                    data-url="{% url 'holding-purchase-delete' tx.pk %}"
                    data-message="{% trans 'Remove this purchase? The units and average cost of the holding are worked out again.' %}">
                <i class="bi bi-trash me-2" aria-hidden="true"></i>{% trans "Delete" %}
            </button>
        </li>
        {% endif %}
    </ul>
</div>

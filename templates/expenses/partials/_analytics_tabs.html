{% load i18n %}
<style>
    /* same pill tabs as the import page; flex centres the label whatever minimum height the global .nav-link rule gives it */
    .analytics-tabs .nav-link { display: inline-flex; align-items: center; justify-content: center; border-radius: 50rem; font-weight: 600; font-size: 0.9rem; }
    /* the app's global .nav-link.active colour is !important, so the white text has to be too */
    .analytics-tabs .nav-link.active,
    .analytics-tabs .nav-link.active:hover { background-color: var(--color-secondary, #0F7657); color: #ffffff !important; }
    /* on a phone the two tabs share one row, so the icons go and the labels get a little smaller */
    @media (max-width: 575.98px) {
        .analytics-tabs .nav-item { flex: 1 1 0; }
        .analytics-tabs .nav-link { width: 100%; font-size: 0.8rem; padding-left: 0.5rem !important; padding-right: 0.5rem !important; }
        .analytics-tabs .nav-link .bi { display: none; }
    }
</style>
<ul class="nav nav-pills analytics-tabs mb-3 gap-1 flex-wrap" aria-label="{% trans 'Analytics' %}">
    <li class="nav-item">
        <a class="nav-link py-1 px-3 {% if request.resolver_match.url_name == 'analytics' %}active{% endif %}" href="{% url 'analytics' %}" {% if request.resolver_match.url_name == 'analytics' %}aria-current="page"{% endif %}>
            <i class="bi bi-pie-chart me-1"></i>{% trans "Spending & cashflow" %}
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link py-1 px-3 {% if request.resolver_match.url_name == 'analytics-mom' %}active{% endif %}" href="{% url 'analytics-mom' %}" {% if request.resolver_match.url_name == 'analytics-mom' %}aria-current="page"{% endif %}>
            <i class="bi bi-graph-up-arrow me-1"></i>{% trans "Net worth & trends" %}
        </a>
    </li>
</ul>

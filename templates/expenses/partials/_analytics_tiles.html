{% load i18n digit_filters %}
<!-- Totals for the period; every tile opens the transactions behind it -->
<div class="row g-3 mb-3">
    {% for tile in tiles %}
    <div class="col-6 col-md-3">
        <a href="{{ tile.href }}" class="card h-100 border-0 shadow-sm anx-tile text-decoration-none text-body">
            <div class="card-body p-3 px-md-4 py-md-3">
                <span class="anx-tile-label d-block">{{ tile.label }}</span>
                <div class="anx-tile-amount">{{ tile.value }}</div>
                <small class="anx-delta anx-delta--{{ tile.delta_class }} fw-bold">{{ tile.delta|default:"&nbsp;" }}</small>
            </div>
        </a>
    </div>
    {% endfor %}
</div>
{% if insight %}
<p class="anx-insight d-flex align-items-start gap-2 mb-3 small"><i class="bi bi-lightbulb text-warning" aria-hidden="true"></i><span>{{ insight }}</span></p>
{% endif %}

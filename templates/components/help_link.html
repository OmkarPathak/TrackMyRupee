{% load i18n %}{# A link to the guide. static/js/help_panel.js opens it in the help panel; without JavaScript it opens the guide. #}
{% if label %}<a href="{{ url }}" target="_blank" rel="noopener" class="tmr-help-link d-inline-flex align-items-center" data-docs-path="{{ path }}" data-docs-src="{{ source }}"><i class="bi bi-book me-1" aria-hidden="true"></i>{{ label }}</a>{% else %}<a href="{{ url }}" target="_blank" rel="noopener" class="tmr-help-btn" data-docs-path="{{ path }}" data-docs-src="{{ source }}" title="{% trans 'Help' %}" aria-label="{% trans 'Help' %}"><i class="bi bi-question-circle" aria-hidden="true"></i></a>{% endif %}

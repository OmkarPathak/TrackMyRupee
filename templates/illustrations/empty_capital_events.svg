    <path d="M5 105H35" stroke="#1D9E75" stroke-width="3" stroke-linecap="round"/>
    <path d="M10 100H30" stroke="#1D9E75" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Sparkle accents -->

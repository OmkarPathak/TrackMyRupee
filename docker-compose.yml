version: '3.8'

services:
  web:
    image: omkarpathak27/trackmyrupee:latest
    container_name: django-finance-tracker_web_1
    command: gunicorn --workers 1 --threads 4 --max-requests 1000 --max-requests-jitter 50 --bind 0.0.0.0:8000 finance_tracker.wsgi:application
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 128M
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - proxy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy-network:
    external: true

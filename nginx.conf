# nginx.conf — Reference configuration for TrackMyRupee production reverse proxy
#
# NOTE: WhiteNoise already sets Cache-Control: max-age=31536000 for hashed assets
# via WHITENOISE_MAX_AGE = 31536000 in Django settings. This nginx config adds
# Brotli/gzip compression and security headers on top.
#
# Place this in your nginx sites-available/ on the production reverse proxy host.

upstream django_app {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    server_name trackmyrupee.com www.trackmyrupee.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trackmyrupee.com www.trackmyrupee.com;

    # SSL — update paths to your certificate
    ssl_certificate     /etc/letsencrypt/live/trackmyrupee.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trackmyrupee.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ── Compression ────────────────────────────────────────────────────────────
    # Brotli (requires ngx_brotli module)
    brotli            on;
    brotli_comp_level 6;
    brotli_static     on;
    brotli_types
        text/html text/plain text/css
        application/javascript application/json
        image/svg+xml font/woff2;

    # gzip fallback
    gzip              on;
    gzip_comp_level   5;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types
        text/html text/plain text/css
        application/javascript application/json
        image/svg+xml font/woff2;

    # ── Long-term immutable caching for content-hashed static assets ────────────
    # WhiteNoise (CompressedManifestStaticFilesStorage) appends a content hash
    # to every static filename, making indefinite caching safe.
    location ~* \.(webp|avif|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|otf|eot|css|js|map)$ {
        proxy_pass         http://django_app;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary Accept-Encoding always;
    }

    # ── Application requests ────────────────────────────────────────────────────
    location / {
        proxy_pass         http://django_app;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        add_header Cache-Control "no-cache" always;
    }

    # ── Security headers ────────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"        always;
    add_header X-Frame-Options         "SAMEORIGIN"     always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    proxy_connect_timeout  10s;
    proxy_read_timeout     60s;
    proxy_send_timeout     60s;
    client_max_body_size   10m;
}
